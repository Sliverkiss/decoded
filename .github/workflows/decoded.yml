name: Decode Obfuscated Python

on:
  push:
    paths:
      - "input.py"
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode input.py → output.py
        run: python decode.py input.py output.py

      - name: Commit and push output.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.py
          if git diff --cached --quiet; then
            echo "No changes to output.py"
          else
            git commit -m "chore: update output.py [skip ci]"
            git push
          fi